# Contoh deployment satu-server: PostgreSQL + migrasi/seed sekali jalan + aplikasi.
# Siapkan file `.env` (lihat docs/DEPLOYMENT.md) berisi minimal:
#   POSTGRES_PASSWORD, APP_URL (https://…), DATA_ENCRYPTION_KEY (openssl rand -base64 32), ADMIN_EMAIL, ADMIN_PASSWORD
# Pasang reverse proxy HTTPS (Caddy/Nginx) di depan port 3000 — JANGAN mengekspos aplikasi tanpa TLS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: trilogika_hris
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d trilogika_hris"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: tools }
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
    environment:
      DATABASE_URL: postgresql://hris:${POSTGRES_PASSWORD}@db:5432/trilogika_hris?schema=public
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?isi DATA_ENCRYPTION_KEY di .env (openssl rand -base64 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?isi ADMIN_EMAIL di .env}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di .env (min. 12 karakter)}
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]

  app:
    build: { context: ., target: runner }
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]   # hanya loopback; proxy HTTPS yang menghadap publik
    environment:
      DATABASE_URL: postgresql://hris:${POSTGRES_PASSWORD}@db:5432/trilogika_hris?schema=public
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:?isi APP_URL (https://…) di .env}
      APP_TIMEZONE: Asia/Jakarta
      TRUST_PROXY: "true"            # aplikasi berada di belakang reverse proxy tepercaya
      TRUST_PROXY_HOPS: "1"          # jumlah proxy tepercaya di depan aplikasi (alamat klien diambil dari kanan X-Forwarded-For)
      # Notifikasi email / WhatsApp & lupa password (opsional; kosong = nonaktif). Lihat docs/DEPLOYMENT.md.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Modul Training & Operations: DEFAULT MATI. Nyalakan bertahap (staging → UAT → production); lihat docs/TRAINING-OPS.md.
      TRAINING_MODULE_ENABLED: ${TRAINING_MODULE_ENABLED:-false}
      TRAINING_WORKER: ${TRAINING_WORKER:-true}
      CHAT_MODULE_ENABLED: ${CHAT_MODULE_ENABLED:-false}
      CHAT_WORKER: ${CHAT_WORKER:-true}
      CHAT_RETENTION_MONTHS: ${CHAT_RETENTION_MONTHS:-6}
      CHECKLIST_REMINDER_WORKER: ${CHECKLIST_REMINDER_WORKER:-true}
      # Pekerja & batas yang diatur lewat .env harus diteruskan di sini agar sampai ke kontainer.
      RETENTION_WORKER: ${RETENTION_WORKER:-true}
      DELIVERY_WORKER: ${DELIVERY_WORKER:-true}
      CONTRACT_REMINDER_WORKER: ${CONTRACT_REMINDER_WORKER:-true}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
volumes:
  pgdata:
